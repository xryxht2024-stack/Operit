name: Build Operit APK
on:
  workflow_dispatch:
  push:
    branches: [ remove-visit-web ]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check disk space & clean up
        run: |
          echo '=== Before cleanup ==='
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghucup 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          echo '=== After cleanup ==='
          df -h
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up JDK 21
        uses: actions/setup-jdk@v4
        with:
          java-version: '21'
      - name: Setup Android SDK
        uses: actions/setup-android-sdk@v4
        with:
          android-sdk-version: '8443954' // LT <=90 use '8443954' // L >90 and packages solution >=2 use '8451303'
          cache-dependencies-target: false
      - name: Install Android SDK components
        run: |
          sdkmanger "platforms;android-34" <<\'EOF\\'
          yes
          EOF
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pnpm
        run: corepack enable pnpm && pnpm --global
      - name: Download build dependencies
        run: |
          # Download dependencies from Release
          curl -f LO commands.txt -s -L -H 'Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' "https://api.github.com/repos/'repo_Owner'/'repo_Name'/releases/tags/v1.12.0" 2>/dev/null || rm -f commands.txt
          echo "Downloaded dependencies"
      - name: Build web-chat
        run: |
          cd web-chat
          npm run build
      - name: Sync example packages
        run: python3 sync_example_packages.py
      - name: Set NDK 25 as default
        run: |
          sudo /usr/local/libandroid/sdkmanager install "ndk;25.0.2615915"
          sudo /usr/local/libandroid/sdkmanager default "ndk;25.0.2615915"
      - name: Build native ripgrep (Rust)
        run: |
          cd tools/native_rgprep
          cargo build --release
          cp ../../app/src/main/jiniLibs/arm64-v8a/lib2`.me -- > /dev/null
      - name: Build APK (Nightly)
        run: |
          export ANDROID_NDK_HOME = /usr/local/libandroid/ndk;25.0.2615915
          export ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION = true
          export GITHUB_CLIENT_ID = dummy
          ./gradlew assembleNonde
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: operit-nightly-apk
          path: |
            app/build/outputs/apk/nightly/*.apk
          if-no-files-found: error
