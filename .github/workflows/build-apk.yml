name: Build Operit APK

on:
  workflow_dispatch:
  push:
    branches: [ remove-visit-web-v11 ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check disk space & clean up
        run: |
          echo "=== Before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          echo "=== After cleanup ==="
          df -h

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.1.8937393"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Download build dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/deps
          RELEASED=false
          if gh release view build-deps --repo ${{ github.repository }} &>/dev/null; then
            echo "→ 从 Release 拉取编译依赖..."
            gh release download build-deps --repo ${{ github.repository }} --dir /tmp/deps && RELEASED=true
          fi
          if [ "$RELEASED" != "true" ]; then
            echo "→ Release 不可用，从 Google Drive 下载..."
            pip install gdown -q
            gdown --folder "https://drive.google.com/drive/folders/1g-Q_i7cf6Ua4KX9ZM6V282EEZvTVVfF7" -O /tmp/deps --remaining-ok || true
            if ls /tmp/deps/*.zip 1>/dev/null 2>&1; then
              echo "→ GD 下载成功，上传到 Release 备份..."
              gh release upload build-deps /tmp/deps/*.zip --repo ${{ github.repository }} --clobber || true
            fi
          fi
          MISSING=""
          for f in models.zip subpack.zip jniLibs.zip libs.zip; do
            found=$(find /tmp/deps -name "$f" 2>/dev/null | head -1)
            if [ -z "$found" ]; then
              MISSING="$MISSING $f"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "   FATAL: Missing critical deps:$MISSING"
            ls -la /tmp/deps/ 2>/dev/null || echo "   /tmp/deps is empty"
            exit 1
          fi
          echo "   All 4 dependency packages confirmed present."
          for f in /tmp/deps/*.zip; do
            [ -f "$f" ] || continue
            name=$(basename "$f" .zip)
            echo "  解压: $name"
            unzip -o "$f" -d .
          done

      - name: Build web-chat
        run: |
          npm install
          npm --prefix web-chat install
          npm run build:webchat

      - name: Sync example packages
        run: |
          python3 ./sync_example_packages.py

      - name: Set NDK 25 as default
        run: |
          NDK25="$ANDROID_SDK_ROOT/ndk/25.1.8937393"
          if [ -d "$NDK25" ]; then
            echo "ANDROID_NDK_HOME=$NDK25" >> $GITHUB_ENV
            echo "$NDK25/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
            echo "→ NDK 25 set as default"
          else
            echo "⚠️ NDK 25 not found at $NDK25, using system default"
          fi

      - name: Build APK (Nightly)
        run: |
          chmod +x ./gradlew
          ./gradlew assembleNightly --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m" \
            --max-workers=2
        env:
          GITHUB_CLIENT_ID: "dummy"
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: operit-nightly-apk
          path: |
            app/build/outputs/apk/nightly/*.apk
          if-no-files-found: error
